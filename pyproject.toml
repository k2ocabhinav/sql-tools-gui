[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-tools"
description = "Desktop SQL preparation and table comparison tools"
requires-python = ">=3.13,<3.14"
dynamic = ["version"]
dependencies = [
    "PySide6-Essentials==6.11.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "PyInstaller==6.22.3",
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.9",
]

[project.scripts]
sql-tools = "sqltools.app:main"

[tool.setuptools.packages.find]
include = ["sqltools*", "logic*"]

[tool.setuptools.dynamic]
version = { attr = "sqltools.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["build", "dist"]
include = ["build.py", "sqltools/**/*.py", "logic/table_comparator.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
